<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MantapKids - Dashboard Permainan Interaktif</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Poppins for kid-friendly typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0F172A; /* Slate dark background for desktop frame */
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom bounce animation for mascot or interactive buttons */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        .animate-float {
            animation: float 2.5s ease-in-out infinite;
        }
        /* Hide scrollbars for clean mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex justify-center items-start sm:py-6">

    <div class="w-full max-w-md bg-slate-50 min-h-screen sm:min-h-[90vh] sm:rounded-[40px] sm:shadow-2xl flex flex-col relative overflow-hidden">

        <!-- Header Section -->
        <header class="px-5 pt-5 pb-3 flex items-center justify-between bg-white/90 backdrop-blur-md sticky top-0 z-30 border-b border-slate-100">
            <div class="flex items-center space-x-3">
                <!-- User Avatar -->
                <div class="w-11 h-11 rounded-full bg-amber-300 border-2 border-amber-400 flex items-center justify-center shadow-inner overflow-hidden flex-shrink-0">
                    <svg class="w-7 h-7 text-amber-700 translate-y-1" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                    </svg>
                </div>
                <div>
                    <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block -mb-0.5">HELLO</span>
                    <h1 class="text-base font-extrabold text-slate-800">Pemain Hebat</h1>
                </div>
            </div>
            <!-- Notification/Settings Badge -->
            <button onclick="playClickSound(); showNotification('Mod bunyi & tetapan diaktifkan!')" class="w-10 h-10 rounded-2xl bg-slate-100 hover:bg-slate-200 active:scale-95 flex items-center justify-center transition-all cursor-pointer shadow-sm">
                <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                </svg>
            </button>
        </header>

        <!-- Scoreboard / Stats Bar -->
        <section class="px-4 py-3">
            <div class="bg-white rounded-2xl p-3.5 shadow-lg shadow-slate-200/50 border border-slate-100 flex items-center justify-around">
                <!-- Bintang -->
                <div class="text-center">
                    <div class="text-lg font-black text-amber-500 tracking-tight">200,000</div>
                    <div class="text-[11px] font-bold text-slate-400 mt-0.5">Bintang</div>
                </div>
                <!-- Divider -->
                <div class="w-px h-7 bg-slate-100"></div>
                <!-- Bermain -->
                <div class="text-center">
                    <div class="text-lg font-black text-indigo-600 tracking-tight">25x</div>
                    <div class="text-[11px] font-bold text-slate-400 mt-0.5">Bermain</div>
                </div>
                <!-- Divider -->
                <div class="w-px h-7 bg-slate-100"></div>
                <!-- Progress -->
                <div class="text-center">
                    <div class="text-lg font-black text-emerald-600 tracking-tight">5/10</div>
                    <div class="text-[11px] font-bold text-slate-400 mt-0.5">Progress</div>
                </div>
            </div>
        </section>

        <!-- Main Game List Container -->
        <main class="px-4 pb-8 flex-1">
            <div class="flex items-center justify-between mb-3.5 px-1">
                <h2 class="text-sm font-extrabold text-slate-700 uppercase tracking-wide">Pilih Permainan Seronok</h2>
                <span class="text-[11px] font-bold text-emerald-600 bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-100">Aktif</span>
            </div>

            <!-- Game Cards Grid (Optimized 2 columns matching user's design reference tightly on mobile screens) -->
            <div id="gameGrid" class="grid grid-cols-2 gap-3">
                <!-- Javascript will populate game cards dynamically -->
            </div>
        </main>

        <!-- Floating Toast Notification -->
        <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/95 text-white px-5 py-3 rounded-2xl shadow-2xl text-xs font-bold opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center space-x-2 border border-slate-700">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="toastText">Tahniah! Permainan dipilih.</span>
        </div>

    </div>

    <script>
        function playClickSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5 note
                oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch(e) {
                // Audio context restriction bypass
            }
        }

        function showNotification(message) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            toastText.innerText = message;
            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 2200);
        }

        // Complete 10 games dataset matching user's reference sketch layout
        const gamesData = [
            { title: "ISI TEMPAT KOSONG", desc: "Susunkan huruf yang betul", color: "bg-[#E2FECC]", buttonColor: "bg-[#FF3B30] active:bg-[#E03229]" },
            { title: "KENAL HAIWAN", desc: "Teka bunyi & nama haiwan", color: "bg-[#C8F5F5]", buttonColor: "bg-[#FF3B30] active:bg-[#E03229]" },
            { title: "KIRA NOMBOR", desc: "Kira buah-buahan & objek", color: "bg-[#FFF6CC]", buttonColor: "bg-[#FF3B30] active:bg-[#E03229]" },
            { title: "EJA HURUF ABC", desc: "Padan huruf besar & kecil", color: "bg-[#FAD4FC]", buttonColor: "bg-[#FF3B30] active:bg-[#E03229]" },
            { title: "KENAL WARNA", desc: "Cari warna yang betul", color: "bg-[#E2FECC]", buttonColor: "bg-[#FF3B30] active:bg-[#E03229]" },
            { title: "CARI PASANGAN", desc: "Uji daya ingatan minda", color: "bg-[#FAD4FC]", buttonColor: "bg-[#FF3B30] active:bg-[#E03229]" },
            { title: "BENTUK GEOMETRI", desc: "Segi tiga, bulat & petak", color: "bg-[#FFF6CC]", buttonColor: "bg-[#FF3B30] active:bg-[#E03229]" },
            { title: "KUANTITI OBJEK", desc: "Mana lebih banyak/sedikit", color: "bg-[#E2FECC]", buttonColor: "bg-[#FF3B30] active:bg-[#E03229]" },
            { title: "PUZZLE TIGA", desc: "Cantumkan gambar haiwan", color: "bg-[#C8F5F5]", buttonColor: "bg-[#FF3B30] active:bg-[#E03229]" },
            { title: "LAGU KANAK-KANAK", desc: "Nyanyi bersama irama riang", color: "bg-[#FFF6CC]", buttonColor: "bg-[#FF3B30] active:bg-[#E03229]" }
        ];

        const gameGrid = document.getElementById('gameGrid');
        
        gamesData.forEach((game) => {
            const card = document.createElement('div');
            card.className = `${game.color} rounded-2xl p-3.5 relative overflow-hidden shadow-sm hover:shadow-md transition-all flex flex-col justify-between border border-black/5`;
            
            card.innerHTML = `
                <div>
                    <h3 class="font-extrabold text-slate-900 text-[12px] leading-tight tracking-tight mb-0.5">${game.title}</h3>
                    <p class="text-[10px] text-slate-600 font-medium leading-tight">${game.desc}</p>
                </div>
                <div class="flex items-end justify-between mt-3">
                    <button onclick="playClickSound(); showNotification('Memulakan: ${game.title}!');" class="${game.buttonColor} text-white font-extrabold text-[10px] px-4 py-1.5 rounded-full shadow-md active:scale-95 transition-transform cursor-pointer tracking-wider">
                        MULA
                    </button>
                    <!-- Cute Animated Frog Mascot SVG -->
                    <div class="w-10 h-10 animate-float flex items-center justify-center -mr-1 -mb-1 flex-shrink-0">
                        <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-sm">
                            <ellipse cx="50" cy="60" rx="32" ry="26" fill="#8BE953"/>
                            <circle cx="35" cy="38" r="10" fill="#8BE953"/>
                            <circle cx="65" cy="38" r="10" fill="#8BE953"/>
                            <circle cx="35" cy="37" r="5" fill="#FFFFFF"/>
                            <circle cx="65" cy="37" r="5" fill="#FFFFFF"/>
                            <circle cx="36" cy="37" r="2" fill="#000000"/>
                            <circle cx="66" cy="37" r="2" fill="#000000"/>
                            <path d="M 40 55 Q 50 65 60 55" stroke="#2D5A1E" stroke-width="3" stroke-linecap="round" fill="none"/>
                            <circle cx="28" cy="54" r="4" fill="#FF8DA1" opacity="0.6"/>
                            <circle cx="72" cy="54" r="4" fill="#FF8DA1" opacity="0.6"/>
                        </svg>
                    </div>
                </div>
            `;
            gameGrid.appendChild(card);
        });
    </script>
</body>
</html>
