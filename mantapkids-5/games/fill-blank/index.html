<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isi Tempat Kosong Ya Kids - MantapKids</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Short Stack for titles & Sniglet for body text -->
    <link href="https://fonts.googleapis.com/css2?family=Short+Stack&family=Sniglet:wght@400&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Shared site styles -->
    <link rel="stylesheet" href="../../shared/shared.css">
    <!-- Confetti effects for Joy tiers -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <!-- Micro-animations specific to THIS game (not shared, per current polish scope) -->
    <style>
        @keyframes tilePopCorrect {
            0%   { transform: scale(1); }
            40%  { transform: scale(1.15); box-shadow: 0 0 0 10px rgba(16,185,129,0.25); }
            100% { transform: scale(1); }
        }
        .tile-pop-correct {
            animation: tilePopCorrect 0.4s ease-out;
            background-color: #10b981 !important;
        }

        @keyframes tileShakeWrong {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .tile-shake-wrong {
            animation: tileShakeWrong 0.35s ease-in-out;
            background-color: #f43f5e !important;
        }

        @keyframes wordPopIn {
            0%   { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .word-pop-in {
            animation: wordPopIn 0.3s ease-out;
        }

        /* Staggered fade-in for the answer option tiles */
        @keyframes tilePopIn {
            0%   { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .tile-pop-in {
            animation: tilePopIn 0.3s ease-out backwards;
        }

        /* Individual letter boxes making up the word display */
        span.letter-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.2rem;
            height: 2.6rem;
            margin: 0 0.15rem;
            font-family: 'Sniglet', cursive, sans-serif !important;
        }
        @media (min-width: 768px) {
            span.letter-box { width: 2.8rem; height: 3.2rem; }
        }

        .blank-box {
            border-bottom: 4px solid #d97706;
        }

        @keyframes blankCorrectPop {
            0%   { transform: scale(1); color: #d97706; }
            50%  { transform: scale(1.3); color: #059669; }
            100% { transform: scale(1); color: #059669; }
        }
        .blank-correct {
            animation: blankCorrectPop 0.5s ease-out;
            color: #059669 !important;
            border-bottom-color: #059669 !important;
        }

        @keyframes blankWrongShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }
        .blank-wrong {
            animation: blankWrongShake 0.35s ease-in-out;
            color: #e11d48 !important;
            border-bottom-color: #e11d48 !important;
        }

        /* Last 5 seconds: timer text turns red and pulses */
        @keyframes timerPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }
        #arena-timer.timer-urgent {
            color: #e11d48;
            animation: timerPulse 0.6s ease-in-out infinite;
        }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-yellow-300 selection:text-yellow-900">

    <div class="max-w-md md:max-w-3xl lg:max-w-5xl mx-auto">

       <!-- Main dynamic viewport container -->
            <div class="relative min-h-dvh w-full flex flex-col justify-between overflow-hidden select-none p-4">

              <!-- 1. Player Progress Div (Top) -->
            <header class="flex flex-col items-center mb-4">
            <div class="w-full bg-white rounded-2xl p-4 md:p-6 shadow-md border-2 border-slate-300 flex justify-between items-center gap-4">
                <a href="../../dashboard.html" class="bg-red-100 hover:bg-red-200 text-red-700 px-4 py-2 rounded-xl font-bold transition flex items-center gap-2 text-sm md:text-base">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div class="flex items-center gap-4">
                    <div id="arena-timer-box" class="bg-sky-100 px-4 py-2 rounded-xl text-sky-900 font-bold text-sm md:text-base flex flex-col gap-1 min-w-[110px]">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-clock text-sky-500"></i> Masa: <span id="arena-timer">30</span>s
                        </div>
                        <div class="w-full h-1.5 bg-sky-200 rounded-full overflow-hidden">
                            <div id="timer-progress-bar" class="h-full bg-sky-500 transition-all duration-1000 ease-linear" style="width: 100%"></div>
                        </div>
                    </div>
                    <div class="bg-amber-100 px-4 py-2 rounded-xl text-amber-900 font-bold text-sm md:text-base flex items-center gap-2">
                        <i class="fa-solid fa-star text-amber-500"></i> Skor: <span id="arena-score">0</span>
                    </div>
                </div>
            </div>
        </header>

              <!-- 2. Game Content (Middle - grows to fill space) -->
              <div class="flex-1 flex flex-col items-center justify-center text-white bg-white rounded-2xl p-6 md:p-8 shadow-2xl border-2 border-sky-300 text-center relative min-h-[400px] w-full mb-4">
                    <div class="flex justify-center w-full">
                        <div id="game-content" class="max-w-xl w-full">
                            <!-- Dynamic question content injected here -->
                        </div>
                    </div>
              </div>

              <!-- Space Reservation Layer -->
              <div class="h-[80px] w-full pointer-events-none relative">
                <div class="absolute bottom-5 left-0 right-0"></div>
              </div>

              <!-- Start Game Modal -->
              <div id="game-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
            <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl border-4 border-yellow-300 relative">
                <div class="w-16 h-16 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-3 shadow-inner">
                    🎮
                </div>

                <h3 id="modal-title" class="text-xl font-bold text-slate-800 mb-1">Permainan Bermula!</h3>
                <p id="modal-desc" class="text-slate-600 text-sm mb-4">Pilih mod permainan awak:</p>

                <!-- 3 Game Mode Buttons -->
                <div class="space-y-2.5 mb-5">
                    <button onclick="startGameMode(30)" class="w-full glossy-btn bg-lime-500 hover:bg-lime-600 text-white font-bold py-3 px-4 rounded-xl shadow-[0_4px_0_#4d7c0f] active:shadow-[0_1px_0_#4d7c0f] active:translate-y-1 transition text-base flex items-center justify-center">
                        30 Saat
                    </button>
                    <button onclick="startGameMode(60)" class="w-full glossy-btn bg-lime-500 hover:bg-lime-600 text-white font-bold py-3 px-4 rounded-xl shadow-[0_4px_0_#4d7c0f] active:shadow-[0_1px_0_#4d7c0f] active:translate-y-1 transition text-base flex items-center justify-center">
                        60 Saat
                    </button>
                    <button onclick="startGameMode(0)" class="w-full glossy-btn bg-lime-500 hover:bg-lime-600 text-white font-bold py-3 px-4 rounded-xl shadow-[0_4px_0_#4d7c0f] active:shadow-[0_1px_0_#4d7c0f] active:translate-y-1 transition text-base flex items-center justify-center">
                        Tiada Had
                    </button>
                </div>

                <div>
                    <a href="../../dashboard.html" class="block w-full bg-slate-200 hover:bg-slate-300 text-slate-700 py-2.5 rounded-xl font-bold transition text-sm">Semula</a>
                </div>
            </div>
        </div>

            </div>
    </div>

    <!-- Shared modules first, then this game's own script -->
    <script src="../../shared/storage.js"></script>
    <script src="../../shared/effects.js"></script>
    <script src="../../shared/gametimer.js"></script>
    <script src="../../shared/wordbank.js"></script>
    <script src="fillblank.js"></script>
</body>
</html>
